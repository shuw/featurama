<meta charset="utf-8">
<script>{
  // The site's root, so files load from any page: strip a known page path, or
  // for an unknown one assume the site sits at / (or /<repo>/ on GitHub Pages).
  // Leading slashes are collapsed so "//other.site/..." can't become the base.
  const path = location.pathname.replace(/^\/+/, "/");
  const page = path.match(/^(.*?\/)(?:(?:attention|play)(?:\/[^/]*)?|zoom(?:\/[^/]*){0,2}|layers|patching|features)\/?$/);
  let root = page ? page[1] : path.replace(/[^/]*$/, "");
  if (!page && root !== "/") root = location.hostname.endsWith(".github.io") ? "/" + path.split("/")[1] + "/" : "/";
  const base = document.createElement("base");
  const url = new URL(root, location.origin);
  base.href = url.origin === location.origin ? url.href : location.origin + "/";
  document.currentScript.after(base);
}</script>
