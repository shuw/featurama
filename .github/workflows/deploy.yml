name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.4
      - run: bun install --frozen-lockfile
      # The weights aren't in git: download GPT-2 and the layer-7 sparse
      # autoencoder from Hugging Face and convert them.
      - run: |
          python3 -m venv .venv-model
          .venv-model/bin/pip install --quiet huggingface-hub==1.33.0 safetensors==0.8.0 numpy==2.5.3
          .venv-model/bin/python -I tools/reference/convert.py
          .venv-model/bin/python -I tools/reference/sae.py
      - run: bunx tsc --noEmit
      - run: bun test tests/tokenizer.test.ts
      - run: bun run build
        env:
          PUBLIC_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
